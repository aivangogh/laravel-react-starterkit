# Dev-tuned Redis for Laravel cache / queue / session.
# Durability on (AOF + RDB snapshots) so local data survives restarts;
# LRU eviction with a modest memory ceiling. Tune or replace for production.

appendonly yes
appendfsync everysec

save 900 1
save 300 10
save 60 10000

maxmemory 512mb
maxmemory-policy allkeys-lru
