name: starterkit

# Local dev data stack. Credentials are read from backend/.env via:
#   docker compose --env-file ./backend/.env up -d --wait postgres redis
# (wrapped by the root `pnpm db:up` / `pnpm db:down` / `pnpm db:reset` scripts).

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-starterkit}
      POSTGRES_USER: ${DB_USERNAME:-starterkit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - starterkit-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-starterkit} -d ${DB_DATABASE:-starterkit}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - starterkit-redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  starterkit-postgres-data:
    name: starterkit-postgres-data
  starterkit-redis-data:
    name: starterkit-redis-data
